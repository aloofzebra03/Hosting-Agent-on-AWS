# Simple docker-compose for local testing
version: '3.8'

services:
  joke-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.0-flash}
      - POSTGRES_DATABASE_URL=${POSTGRES_DATABASE_URL}
    restart: unless-stopped
